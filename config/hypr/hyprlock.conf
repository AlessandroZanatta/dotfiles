# Music
# Card background
image {
    monitor =
    path = /tmp/hyprlock_art_blur.png
    reload_time = 5
    reload_cmd = $music --blurarturl
    size = 130
    rounding = 20
    border_size = 0
    position = -60, -60
    halign = right
    valign = top
    zindex = 1
}

# Dim overlay
shape {
    monitor =
    size = 460, 130
    color = rgba(0, 0, 0, 0.45)
    rounding = 20
    position = -60, -60
    halign = right
    valign = top
    zindex = 2
}

# Album art (left side)
image {
    monitor =
    path = /tmp/hyprlock_art.png
    reload_time = 5
    reload_cmd = $music --arturl
    size = 110
    border_size = 0
    rounding = 12
    position = -400, -70
    halign = right
    valign = top
    zindex = 5
}

# Song title
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = rgba(255, 255, 255, 0.95)
    font_size = 13
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = -290, -105
    halign = right 
    valign = top
    zindex = 5
}

# Artist - Album
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist) – $($music --album)"
    color = rgba(255, 255, 255, 0.6)
    font_size = 10
    font_family = JetBrains Mono Nerd Font Mono
    position = -175, -125
    halign = right 
    valign = top
    zindex = 5
}

# Controls: Previous
label {
    monitor =
    text = ⟲
    onclick = playerctl previous
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    # position = -10, 45
    halign = right 
    valign = top
    zindex = 5
}

# Controls: Play/Pause
label {
    monitor =
    text = cmd[update:1000] echo "$($music --status)"
    onclick = playerctl play-pause
    color = rgba(255, 255, 255, 1)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Mono
    # position = 30, 43
    halign = right 
    valign = top
    zindex = 5
}

# Controls: Next
label {
    monitor =
    text = ⟫
    onclick = playerctl next
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    # position = 70, 45
    halign = right 
    valign = top
    zindex = 5
}
